name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Node 24 (ships npm 11.x) matches the local/dev toolchain. On Node 20/22
        # (npm 10.x) `npm ci` hangs ~8 min then dies with "Exit handler never
        # called!" (npm 10.x CLI bug, fixed in 11.x), leaving node_modules half-
        # installed — which then surfaced downstream as `eslint: not found`.
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - run: npm ci
      - name: Lint & typecheck
        run: npm run lint && npm run typecheck
      - name: Build (all packages; emits dist/cli.js)
        run: npm run build
      - name: Tests (includes validation-matrix + codegen snapshots + round-trip)
        run: npm run test
      - name: Regenerate template gallery & lint generated assets
        run: |
          # The template gallery + fixtures land in M1. Until fixtures/ exists this
          # step is a no-op; once it does, regenerate, lint, and fail on drift.
          if [ -d fixtures ]; then
            npm run -s fixtures:regen || echo "fixtures target lands in M1"
            find fixtures -name '*.sh' -print0 | xargs -0 -r shellcheck
            find fixtures -name 'settings.json' -print0 | xargs -0 -r -n1 jq empty
            git diff --exit-code -- fixtures || { echo "::error::Codegen drift: commit regenerated fixtures"; exit 1; }
          else
            echo "no fixtures/ yet (M1); skipping gallery lint"
          fi
      - name: Validate committed graphs
        run: |
          find . -name '*.clauflow.json' -not -path './node_modules/*' -print0 \
            | xargs -0 -r -n1 node packages/core/dist/cli.js validate || echo "cli lands in M1"
      - name: Extension package dry-run
        run: npm run -s package:vscode -- --no-git-tag-version || echo "vsce dry-run lands in M4"
